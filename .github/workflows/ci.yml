name: CI

# vite build も tsx も型を検査せずに落とすだけなので、
# 型チェックをここで走らせないと型エラーは本番デプロイまで通り抜ける。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: Service Worker にプレースホルダが残っていないか
        # 置換は closeBundle でしか走らないので、壊れたときに気づけるようにする
        run: |
          node --check dist/sw.js
          if grep -q '__PRECACHE__\|__VERSION__\|__BASE__' dist/sw.js; then
            echo "sw.js の置換が行われていない" >&2
            exit 1
          fi
